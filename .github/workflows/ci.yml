# Continuous integration for the reckoner app: lint, unit tests (Vitest), and a production build on every pull request and on push to `main`.
# Catches type/build breakage before the cache-zip workflow ships from main.
#
# R3-648 — until this landed, this repo's workflows were `cache.yml` alone: the Pages
# cache-zip publisher, which runs on push to main and runs no checks. So nothing ran on a
# pull request, and a PR here merged on the author's word that they had run the suite
# locally. R3-641 is the evidence against trusting that: a symbol nothing imported reached
# site-main's `main` while its PR reported success, because the leg that would have caught
# it was not a CI step.
#
# Modelled on `file-explorer`/`editor`'s ci.yml deliberately — one shape across the app
# repos, not a fourth.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run — on a PR branch only. A push
# run gets its OWN group (the SHA), so it can never be cancelled by a later merge.
#
# `cancel-in-progress: false` alone was not enough, and the first version of this comment
# overstated it: the group was still keyed on `github.ref`, and GitHub keeps at most one
# PENDING run per group, so a third merge inside the window still cancelled the middle
# commit's queued run. That moved the threshold from two merges to three rather than
# removing it. Keying push runs by SHA is what actually removes it.
#
# `workflow_dispatch` — the third trigger these workflows declare, and the one the fix
# above did not reason about — takes the non-push arm, so a manual run shares the bare
# `ci-<ref>` group and is not cancelled in flight. Harmless, and named because it is the
# one remaining case where the one-pending-run-per-group rule still applies.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA (see cache.yml rationale).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `--max-warnings 0`, because a warning here is a defect that merges otherwise.
      #
      # This step was copied from file-explorer/editor carrying an `env: CI: true` block
      # and the comment "ESLint and tooling treat warnings as errors under CI, matching
      # the deploy-time build gate". BOTH HALVES WERE FALSE and the review gate caught it
      # by measuring: `CI=true npx eslint --rule '{"max-lines":["warn",1]}'` exits 0 and
      # prints "0 errors, 1 warning"; ESLint reads no `CI` env var at all; Actions already
      # sets `CI=true` in every job, so the block was a no-op; and `cache.yml` — the only
      # other workflow here — runs no lint or build, so there is no deploy-time gate to
      # match. Meanwhile `react-hooks/exhaustive-deps` is warn-level in this repo, so an
      # exhaustive-deps violation would have merged with this step green.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
